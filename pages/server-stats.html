<div id="page-server-stats" class="main-page w-full max-w-5xl mx-auto p-8">
                <div class="page-intro mb-8">
                    <h2 class="text-xl font-bold tracking-widest uppercase text-white">Server stats</h2>
                    <p class="text-sm text-slate-400 mt-2 tracking-wide">Page views by day (UTC), counted on the API host. Data stays on the server across restarts when the disk is persistent.</p>
                </div>
                <div class="bg-matte-900 rounded-lg border border-matte-800 p-6 space-y-6">
                    <div class="flex flex-wrap items-end justify-between gap-4">
                        <div>
                            <p class="text-[10px] font-bold tracking-widest uppercase text-slate-500">Total (selected range)</p>
                            <p id="server-stats-total" class="text-2xl font-bold tracking-widest text-white mt-1">—</p>
                        </div>
                        <div class="flex items-center gap-2">
                            <label for="server-stats-days" class="text-[10px] font-bold tracking-widest uppercase text-slate-500 shrink-0">Days</label>
                            <select id="server-stats-days" class="tool-picklist-input h-9 px-3 rounded-lg bg-matte-950 border border-matte-800 text-xs text-slate-200 min-w-[5rem]" aria-label="Chart range in days">
                                <option value="7">7</option>
                                <option value="14" selected>14</option>
                                <option value="30">30</option>
                                <option value="60">60</option>
                            </select>
                            <button type="button" id="server-stats-refresh" class="ui-interactive h-9 px-3 rounded-lg border border-matte-800 bg-matte-950 text-xs font-bold tracking-widest uppercase text-slate-400 hover:text-white hover:border-matte-700">Refresh</button>
                        </div>
                    </div>
                    <div id="server-stats-chart-wrap" class="server-stats-chart-wrap rounded-lg border border-matte-800 bg-matte-950/80 p-4 min-h-[220px] flex flex-col">
                        <div id="server-stats-chart-empty" class="text-sm text-slate-500 tracking-wide m-auto hidden" role="status">No data in this range yet.</div>
                        <svg id="server-stats-chart" class="server-stats-chart w-full flex-1" viewBox="0 0 640 200" preserveAspectRatio="none" aria-hidden="true"></svg>
                        <div id="server-stats-labels" class="server-stats-chart-labels flex justify-between gap-1 mt-2 text-[9px] tracking-wider uppercase text-slate-500 overflow-x-auto"></div>
                    </div>
                </div>
            </div>
