<div id="page-scrims" class="main-page scrims-hub w-full max-w-5xl mx-auto p-8 pb-12">
                <div class="page-intro mb-8">
                    <h2 class="text-xl font-bold tracking-widest uppercase text-white">Scrims</h2>
                    <p class="text-sm text-slate-400 mt-2 tracking-wide">Create a lobby and play competitive scrims</p>
                </div>
                <div class="scrims-hub-stack">
                    <section
                        id="scrims-queue"
                        class="scrims-glass scrims-glass--queue"
                        aria-labelledby="scrims-queue-title"
                    >
                        <header class="scrims-hero-head">
                            <div class="scrims-hero-copy">
                                <p id="scrims-queue-title" class="scrims-hero-kicker">Matchmaking lobby</p>
                            </div>
                            <div class="scrims-hero-meta">
                                <div id="scrims-queue-state-badge" class="scrims-pill scrims-pill--idle">No lobby</div>
                                <div id="scrims-queue-timer-wrap" class="scrims-timer hidden" aria-live="off">
                                    <i class="fa-regular fa-clock" aria-hidden="true"></i>
                                    <span id="scrims-queue-timer">00:00</span>
                                </div>
                                <div id="scrims-live-actions" class="scrims-live-actions hidden" hidden>
                                    <button
                                        type="button"
                                        id="scrims-end-match"
                                        class="scrims-cta scrims-cta--end"
                                    >
                                        End match
                                    </button>
                                </div>
                            </div>
                        </header>

                        <div id="scrims-queue-lobby-body" class="scrims-queue-lobby-body">
                        <div
                            id="scrims-lobby-invite"
                            class="scrims-lobby-invite hidden"
                            aria-live="polite"
                        >
                            <p class="scrims-lobby-invite-label">Lobby invite link</p>
                            <div class="scrims-lobby-invite-row">
                                <input
                                    id="scrims-lobby-link"
                                    class="scrims-lobby-link-input"
                                    type="text"
                                    readonly
                                    aria-readonly="true"
                                />
                                <button type="button" id="scrims-copy-lobby-link" class="scrims-lobby-copy ui-interactive">
                                    Copy link
                                </button>
                            </div>
                            <p id="scrims-lobby-code" class="scrims-lobby-code"></p>
                        </div>

                        <div class="scrims-roster-block">
                            <h3 class="scrims-roster-label">Players</h3>
                            <div id="scrims-queue-slots" class="scrims-roster-grid" aria-label="Player slots"></div>
                        </div>

                        <div class="scrims-roster-block scrims-roster-block--admins">
                            <h3 class="scrims-roster-label">Admins <span id="scrims-admin-cap-label" class="scrims-roster-sublabel">(0 / 2)</span></h3>
                            <div id="scrims-admin-slots" class="scrims-roster-grid scrims-roster-grid--admins" aria-label="Admin slots (2)"></div>
                        </div>

                        <div class="scrims-lobby-actions">
                            <button
                                type="button"
                                id="scrims-queue-sign-in"
                                class="scrims-cta scrims-cta--discord ui-interactive"
                            >
                                <i class="fa-brands fa-discord" aria-hidden="true"></i>
                                Sign in with Discord
                            </button>
                            <button type="button" id="scrims-create-lobby" class="scrims-cta scrims-cta--join ui-interactive hidden" hidden>
                                Create lobby
                            </button>
                            <div id="scrims-join-choices" class="scrims-join-choices hidden" hidden>
                                <button
                                    type="button"
                                    id="scrims-join-as-player"
                                    class="scrims-cta scrims-cta--join ui-interactive"
                                >
                                    Join as player
                                </button>
                                <button
                                    type="button"
                                    id="scrims-join-as-admin"
                                    class="scrims-cta scrims-cta--admin ui-interactive"
                                >
                                    Join as admin
                                </button>
                            </div>
                        </div>

                        <div id="scrims-invite-join-managed" class="scrims-lobby-managed hidden" hidden>
                            <button
                                type="button"
                                id="scrims-leave-lobby"
                                class="scrims-cta scrims-cta--leave ui-interactive"
                            >
                                Leave lobby
                            </button>
                            <button
                                type="button"
                                id="scrims-start-match"
                                class="scrims-cta scrims-cta--start ui-interactive"
                            >
                                Start match
                            </button>
                        </div>
                        </div>
                    </section>

                    <section
                        id="scrims-veto"
                        class="scrims-glass scrims-glass--veto hidden"
                        hidden
                        aria-labelledby="scrims-veto-kicker"
                    >
                        <div
                            id="scrims-veto-panel"
                            class="scrims-veto-panel"
                            role="region"
                            aria-label="Map ban"
                        ></div>
                    </section>

                    <section
                        id="scrims-matches"
                        class="scrims-glass scrims-glass--matches"
                        aria-labelledby="scrims-matches-title"
                    >
                        <header class="scrims-matches-head">
                            <div class="scrims-matches-title-row">
                                <span class="scrims-live-icon" aria-hidden="true">
                                    <span class="scrims-live-dot"></span>
                                </span>
                                <h3 id="scrims-matches-title" class="scrims-matches-title">LIVE MATCHES</h3>
                            </div>
                            <span id="scrims-matches-live" class="scrims-pill scrims-pill--live">0 live</span>
                        </header>
                        <div id="scrims-matches-empty" class="scrims-matches-empty">
                            <div class="scrims-matches-empty-ring" aria-hidden="true">
                                <i class="fa-solid fa-magnifying-glass"></i>
                            </div>
                            <p class="scrims-matches-empty-title">Searching for matches&hellip;</p>
                            <p class="scrims-matches-empty-desc">
                                No active matches. When a lobby fills, team lineups appear here.
                            </p>
                        </div>
                        <div id="scrims-matches-active" class="scrims-matches-active hidden" hidden aria-live="polite"></div>
                    </section>
                </div>
            </div>
