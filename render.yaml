# Render Blueprint — Café Core API (Discord auth, BL API, match voice bot, static host)
# Dashboard: New → Blueprint → connect this repo, or New → Web Service → use settings below.
services:
  - type: web
    name: cafe-core
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/auth/discord/config
    envVars:
      - key: NODE_VERSION
        value: "20"
      # Add secrets in Render Dashboard → Environment only (never commit):
      # DISCORD_CLIENT_ID, DISCORD_CLIENT_SECRET, DISCORD_REDIRECT_URI, SESSION_SECRET,
      # PUBLIC_ORIGIN, CORS_ORIGINS, DISCORD_BOT_TOKEN, DISCORD_GUILD_ID,
      # DISCORD_MATCH_CATEGORY_ID, DISCORD_MATCH_CATEGORY_NAME, DISCORD_TEAM_ROLE_PREFIX,
      # UPSTASH_REDIS_REST_URL, UPSTASH_REDIS_REST_TOKEN, STATS_CC_API_KEY