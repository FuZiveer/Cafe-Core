# Optional Render Blueprint — import repo on Render or adjust names to match your service.
services:
  - type: web
    name: cafe-core
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: DISCORD_REDIRECT_URI
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: PUBLIC_ORIGIN
        sync: false
      - key: CORS_ORIGINS
        sync: false
